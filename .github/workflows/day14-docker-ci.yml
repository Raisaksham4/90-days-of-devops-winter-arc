name: Day 14 Docker CI

on:
  push:
    branches:
      - main
    paths:
      - "Day-14/**"
      - ".github/workflows/day14-docker-ci.yml"
  pull_request:
    paths:
      - "Day-14/**"
      - ".github/workflows/day14-docker-ci.yml"

permissions:
  contents: read

env:
  LOCAL_IMAGE: winter-arc-app:${{ github.sha }}
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/winter-arc-app

jobs:
  build-test-scan:
    name: Lint, build, test, scan and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Day-14/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: Day-14
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name api -p 5000:5000 "$LOCAL_IMAGE"
          trap 'docker rm -f api >/dev/null 2>&1 || true' EXIT

          for attempt in {1..15}; do
            if curl -fsS http://localhost:5000/health; then
              echo
              echo "Health check passed on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done

          docker logs api
          exit 1

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish immutable SHA tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker tag "$LOCAL_IMAGE" "$REGISTRY_IMAGE:${{ github.sha }}"
          docker push "$REGISTRY_IMAGE:${{ github.sha }}"
